      <div class="f"><label>Kode captcha</label><div class="caprow"><canvas id="cap" width="130" height="44"></canvas><button type="button" class="btn ghost sm" onclick="newCap()" title="Ganti kode">↻</button><input id="capIn" autocomplete="off" maxlength="5" placeholder="Ketik kode"></div></div>

  <div class="col">
    <header class="top"><div id="clk"></div><div class="sp"></div>
      <button type="button" class="nfbtn ckbtn" onclick="ckOpen()" title="Cari (Ctrl+K)" aria-label="Cari"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><kbd>Ctrl K</kbd></button>

      <div id="avwrap"><div class="av" id="av" onclick="toggleMenu()"></div>
        <div class="dd" id="umenu"><div id="umName"></div><button onclick="document.getElementById('avf').click()">Ganti foto</button><button onclick="pwSelf()">Ganti password</button><button onclick="auth.signOut()">Keluar</button></div></div>

    </header>
    <main id="view"></main>
  </div>
