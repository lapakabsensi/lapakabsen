<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Super Admin</title>
<link rel="stylesheet" href="../css/style.css?v=71">
<style>
.chipbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chipf{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}.chipf small{color:var(--mut);margin-left:3px}.chipf:hover{border-color:var(--ac)}.chipf.on{background:var(--ac);border-color:var(--ac);color:#fff}.chipf.on small{color:#ffffffcc}
.pmsel{width:auto!important;display:inline-block;padding:4px 32px 4px 12px!important;margin:0 2px;background-position:right 10px center!important;background-size:12px!important}
.actst{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--mut)}.actst b{color:var(--ink)}.actbox{border-left:5px solid var(--ac)}
body{-webkit-tap-highlight-color:transparent}
.sabrand{font-size:56px;line-height:1;background:#fff;border-radius:28px;width:120px;height:120px;display:grid;place-items:center;overflow:hidden}.sabrand,#sLogo{position:relative}.lbrand .sabrand img,.sabrand img{padding:0!important;background:none!important;border-radius:0!important;filter:none!important;position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain}#sLogo img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}#sLogo{flex:none;width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;padding:3px}#sLogo{position:relative}#sLogo img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}.lgp{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}.lgp .sabrand{width:72px;height:72px;font-size:34px;background:var(--bg);border:1px solid var(--line)}.sw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.nfb{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;display:grid;place-items:center;padding:0;margin-right:8px}.nfb:hover{border-color:var(--ac)}
.nbd{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}.nbd:empty{display:none}
#bdd{position:fixed;top:60px;right:16px;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(15,23,42,.22);z-index:150;display:none}
#bdd h4{margin:0;padding:12px 16px;font-size:14px;border-bottom:1px solid var(--line)}.bi{padding:11px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:14px;line-height:1.45}.bi:hover{background:#f8fafc}.bi small{color:var(--mut);display:block}.bi b{color:var(--ink)}.bno{padding:22px;text-align:center;color:var(--mut)}
.top .ttl{font-weight:700;font-size:17px}.top .who2{color:var(--mut);font-size:13px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside a>span:first-child{display:inline-block;width:22px;text-align:center}
aside a{align-items:center}
aside a .badge{width:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:auto;font-weight:700}.badge:empty{display:none}
main{margin:0 auto}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.st b{font-size:28px}
.req{border:1px solid #fde68a;background:#fffbeb;border-radius:14px;padding:14px;margin-bottom:10px}
.code{font:700 18px ui-monospace,monospace;letter-spacing:.05em}
.tag{white-space:nowrap}.tag.bl{background:#e0e7ff;color:#3730a3}
.row{flex-wrap:wrap}
td,th{white-space:normal;vertical-align:top}td{min-width:70px}
pre{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#toast{max-width:90vw;top:70px}
#dm{position:fixed;inset:0;background:#0f172acc;z-index:200;display:none;overflow:auto;padding:20px}
#dm>div{background:#fff;border-radius:18px;max-width:900px;margin:0 auto;padding:20px}
.lform .lc h1{font-size:26px}
.lform .lc small.v{font-weight:400;color:var(--mut)}
@media(max-width:800px){
 main{padding:14px 12px 96px}
 #dm{padding:0}#dm>div{border-radius:0;min-height:100%;padding:16px 14px 40px}
 .box{padding:14px}.fg{grid-template-columns:1fr}table{font-size:13px}td,th{padding:8px 5px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.st{padding:14px}.st b{font-size:24px}
 .top .who2{display:none}
 .row>.btn,.req .row .btn{flex:0 0 auto}
 .sabrand{width:72px;height:72px;font-size:36px;border-radius:20px}
 aside a{flex-direction:column;gap:2px}aside a>span:first-child{font-size:20px}aside a .badge{position:absolute;top:2px;right:18%;margin:0;font-size:10px;padding:0 5px}
 aside a{position:relative}
}
</style></head><body>
<div id="toast"></div>
<div id="login">
 <section class="lbrand"><div class="sabrand" id="bLogo">🛡️</div><h2 id="bName">Super Admin</h2><p id="bSub">Panel Khusus Penyedia Layanan Absen Yuk</p></section>
 <section class="lform"><div class="lc"><h1 id="bHi">Selamat Datang</h1><p class="mut" style="margin:4px 0 16px">Gunakan akun super admin Anda</p>
  <div class="f"><label>Email</label><input id="em" type="email" autocomplete="username"></div>
  <div class="f"><label>Password</label><div class="pwbox"><input id="pw" type="password" autocomplete="current-password"><button type="button" class="eye" id="eye" onclick="eye()">👁️</button></div></div>
  <div class="f"><label>Kode captcha</label><div class="caprow"><canvas id="cap" width="130" height="44"></canvas><button type="button" class="btn ghost sm" onclick="newCap()" title="Ganti kode">↻</button><input id="capIn" autocomplete="off" maxlength="5" placeholder="Ketik kode"></div></div>
  <button class="btn" id="bLogin" style="width:100%">Masuk</button>
  <p style="margin-top:12px;text-align:center"><a href="#" id="bReset" style="font-size:14px;color:var(--ac)">Lupa password?</a></p>
  <p id="loginMsg" style="display:none;margin-top:10px;font-size:13px;color:var(--bad);text-align:left;white-space:pre-line;word-break:break-word"></p>
  <a href="#" id="bDiag" style="display:none"></a>
  <p id="setupRow" style="display:none;margin-top:14px;text-align:center"><a href="#" id="bSetup">Setup super admin pertama</a></p></div></section>
</div>
<div id="shell" style="display:none">
 <aside><div class="brand"><span id="sLogo" style="font-size:24px">🛡️</span><span id="sName">Super Admin</span></div><div id="nav" style="display:contents"></div><div class="who" id="who"></div></aside>
 <div class="col">
  <header class="top"><span class="ttl" id="ttl"></span><div class="sp"></div><button type="button" class="nfb" id="bell" onclick="bellToggle(event)" title="Notifikasi" aria-label="Notifikasi">🔔<span class="nbd" id="bellN"></span></button><div id="bdd"></div><span class="who2" id="who2"></span><button class="btn ghost sm" onclick="auth.signOut()">Keluar</button></header>
  <main id="view"></main>
 </div>
</div>
<div id="dm" onclick="if(event.target===this)this.style.display='none'"><div id="dmc"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../js/dialog.js?v=4"></script>
<script src="minipdf.js?v=1"></script>
<script src="../js/licpdf.js?v=2"></script>
<script src="super.js?v=20261109x"></script>
</body></html>
