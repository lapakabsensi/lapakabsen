name: Build Capacitor APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['android/**', '.github/workflows/build-android.yml', '*.md']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Siapkan kunci penandatangan (dari GitHub Secrets)
        working-directory: .
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_B64 dan ANDROID_KEYSTORE_PASSWORD belum dibuat. Lihat android/README.md bagian 'Kunci penandatangan'."; exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
      - run: npm install
      - run: pip install pillow
      - run: python3 prepare.py web
      - run: npx cap add android
      - run: python3 prepare.py native
      - run: npx cap sync android
      - name: Build release (unsigned)
        working-directory: capacitor/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Zipalign + sign
        working-directory: capacitor/android
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          $BT/apksigner sign --ks "$KEYSTORE_PATH" --ks-key-alias lapakabsensi \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out Lapak-Absen.apk aligned.apk
          $BT/apksigner verify --print-certs Lapak-Absen.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: Lapak-Absen-APK
          path: capacitor/android/Lapak-Absen.apk
