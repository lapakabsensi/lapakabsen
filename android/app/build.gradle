plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.lapakabsensi.twa'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.lapakabsensi.twa"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            hostName: "lapakabsensi.github.io",
            defaultUrl: "https://lapakabsensi.github.io/lapakabsensi/",
            launcherName: "Lapak Absen",
            assetStatements: '[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "android_app", "package_name": "io.github.lapakabsensi.twa", "sha256_cert_fingerprints": ["5A:0C:B9:65:63:DF:D3:6B:CC:85:B6:58:B9:85:76:52:03:5F:23:18:05:6F:84:65:57:D8:67:5C:55:08:92:D6"]}}]'
        ]
    }

    // Kunci penandatangan TIDAK disimpan di repo. Workflow GitHub Actions membuatnya dari Secrets (lihat android/README.md).
    // Tanpa KEYSTORE_PATH, build release tetap jalan tetapi tidak bertanda tangan.
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "lapakabsensi"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_PATH")) { signingConfig signingConfigs.release }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Android Browser Helper (Trusted Web Activity - TWA)
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
