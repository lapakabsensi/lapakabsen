plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.lapakabsensi.twa'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.lapakabsensi.twa"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            hostName: "lapakabsensi.github.io",
            defaultUrl: "https://lapakabsensi.github.io/lapakabsensi/",
            launcherName: "Absensi & Payroll",
            assetStatements: '[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "android_app", "package_name": "io.github.lapakabsensi.twa", "sha256_cert_fingerprints": ["AE:70:7D:07:C0:D4:50:0E:AD:83:90:50:0D:14:FE:A7:10:9C:74:7A:E9:37:68:7A:82:CE:D0:EC:1F:54:0C:5E"]}}]'
        ]
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
            keyAlias "lapakabsensi"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Android Browser Helper (Trusted Web Activity - TWA)
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
